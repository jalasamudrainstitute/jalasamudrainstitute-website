name: Install JSI original favicon
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-jsi-favicon.yml'
      - 'v2/scripts/build.py'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and resize original WordPress site icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image
          from pathlib import Path
          url='https://jalasamudrainstitute.wordpress.com/wp-content/uploads/2024/08/jala-samudra-institute-jsi-white.png'
          req=Request(url,headers={'User-Agent':'Mozilla/5.0 JSI-Favicon-Migration'})
          raw=urlopen(req,timeout=35).read()
          im=Image.open(BytesIO(raw)).convert('RGBA')
          if im.width<48 or im.height<48: raise RuntimeError('Source icon too small')
          target=Path('v2')
          im.resize((48,48),Image.Resampling.LANCZOS).save(target/'favicon-48.png',optimize=True)
          im.resize((96,96),Image.Resampling.LANCZOS).save(target/'favicon-96.png',optimize=True)
          im.resize((192,192),Image.Resampling.LANCZOS).save(target/'favicon-192.png',optimize=True)
          im.save(target/'favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48)])
          print('Created original JSI favicon assets from WordPress icon #146')
          PY
      - name: Commit icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/favicon.ico v2/favicon-48.png v2/favicon-96.png v2/favicon-192.png
          git diff --cached --quiet || (git commit -m "Add original JSI favicon from WordPress" && git push)
