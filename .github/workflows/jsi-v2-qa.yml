name: JSI v2 quality checks
on:
  push:
    branches: [rebuild/jsi-v2]
    paths: ['v2/**', '.github/workflows/jsi-v2-qa.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/jsi-v2-qa.yml']
  workflow_dispatch:
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate article pages
        run: python3 v2/scripts/build.py
      - name: Validate site routes and publication records
        run: python3 v2/scripts/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check v2/assets/site.js
          node --check v2/assets/research.js
