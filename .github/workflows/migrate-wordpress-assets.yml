name: Preserve original WordPress assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/migrate_wordpress_assets.py'
      - 'data/asset-migration-manifest.json'
      - '.github/workflows/migrate-wordpress-assets.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate original WordPress files
        run: python scripts/migrate_wordpress_assets.py
      - name: Commit verified assets and update links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/original/ data/asset-migration-manifest.json index.html research/index.html articles/
          if ! git diff --cached --quiet; then
            git commit -m "Preserve verified original WordPress assets locally"
            git push
          fi
